# Database CI workflow — pgTAP + schema verification
# Runs alongside the existing 7 workflows (ci, codeql, etc.).
# Triggered when Supabase migrations, Prisma schema, or DB-access code changes.

name: database-ci

on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - "prisma/**"
      - "src/lib/db.ts"
      - "src/lib/repositories/**"
      - "src/lib/services/**"
      - "src/app/api/**"
      - ".github/workflows/database-ci.yml"
      - "pnpm-workspace.yaml"
      - "package.json"
  pull_request:
    branches: [main]
    paths:
      - "supabase/**"
      - "prisma/**"
      - "src/lib/db.ts"
      - "src/lib/repositories/**"
      - "src/lib/services/**"
      - "src/app/api/**"
      - ".github/workflows/database-ci.yml"
      - "pnpm-workspace.yaml"
      - "package.json"

jobs:
  db-test:
    name: Database schema & tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.4
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval "10s"
          --health-timeout "5s"
          --health-retries "5"

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install pgtap
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-17-pgtap

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup database (roles, extensions)
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE IF NOT EXISTS anon;
          CREATE ROLE IF NOT EXISTS authenticated;
          CREATE EXTENSION IF NOT EXISTS pgcrypto;
          SQL

      - name: Generate Prisma client
        run: pnpm prisma generate

      - name: Apply Supabase migrations (baseline + incremental)
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f "supabase/migrations/20260605000000_baseline_from_prisma.sql"
          PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f "supabase/migrations/20260709000001_seed_pipeline_stages.sql"
          PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f "supabase/migrations/20260807000000_webhook_events_table.sql"
          PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f "supabase/migrations/20260807000001_outbox_events_table.sql"
          PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f "supabase/migrations/20260807000002_security_rls_revoke.sql"

      - name: Run pgTAP tests
        run: |
          for test_file in supabase/tests/*.test.sql; do
            echo "=== Running: $test_file ==="
            output=$(PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -t -A -f "$test_file" 2>&1)
            echo "$output"
            if echo "$output" | grep -qE "^not ok"; then
              echo "FAIL: Tests failed in $test_file"
              exit 1
            fi
          done

      - name: Run db lint
        run: |
          echo "Schema applied. Running manual lint checks..."
          PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -tc "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public' AND table_type = 'BASE TABLE';" | grep -q "15" || { echo "FAIL: Expected 15 base tables"; exit 1; }
          PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -tc "SELECT count(*) FROM pg_tables WHERE schemaname = 'public' AND rowsecurity = false;" | grep -q "0" || { echo "FAIL: RLS not enabled on all tables"; exit 1; }

      - name: Typecheck
        run: pnpm typecheck
