name: Lighthouse
on:
  deployment_status:

permissions:
  contents: read
  # Necesario para subir artefactos de Lighthouse a GitHub.
  checks: write

jobs:
  lighthouse:
    if: >-
      github.event.deployment_status.state == 'success' &&
      (
        github.event.deployment_status.environment == 'Preview' ||
        github.event.deployment_status.environment == 'Production'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12.6.2
        with:
          urls: ${{ github.event.deployment_status.target_url }}
          budgetPath: .github/lighthouse-budget.json
          uploadArtifacts: true
          temporaryPublicStorage: true
